# 🏨 Nome do nosso hotel/sistema
spring.application.name=hotelweb


# 🗄️ Banco H2 local, salvo na pasta data do projeto.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hotelweb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}


# 👤 Usuário padrão do banco H2.
spring.datasource.username=${DB_USER:root}


# 🔑 Senha do banco H2 (vazia por padrão).
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# 🛠️ Diz para o Hibernate atualizar as tabelas
# É como deixar o funcionário arrumar os armários do banco
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Os usuários iniciais são criados por DadosIniciaisConfig, com senhas BCrypt.
# Não executa o data.sql, que não é necessário e causaria duplicações ao reiniciar.
spring.sql.init.mode=never


# 👀 Mostra no terminal os comandos que o sistema está fazendo no banco
spring.jpa.show-sql=true


# 📝 Deixa os comandos SQL mais organizados e fáceis de ler
spring.jpa.properties.hibernate.format_sql=true


# 🔒 Protege o cookie da sessão
# Impede que JavaScript do navegador consiga acessá-lo diretamente
server.servlet.session.cookie.http-only=true


# 🛡️ Adiciona outra proteção ao cookie da sessão
# Ajuda a impedir que outros sites usem o cookie de forma indevida
server.servlet.session.cookie.same-site=lax


# 🚨 Quando acontecer um erro, mostra a mensagem explicando o que aconteceu
server.error.include-message=always                                 

#Esse arquivo ensina o nosso sistema onde está o banco, como entrar nele, como trabalhar com as tabelas e algumas regras de segurança.

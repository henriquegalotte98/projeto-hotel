<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HotelWeb - Login de Acesso</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/theme.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">
    <div class="login-wrapper">
        <div class="login-card">
            <!-- Cabeçalho -->
            <div class="login-header">
                <div class="login-logo">
                    <i class="fa-solid fa-hotel"></i>
                </div>
                <div class="login-brand">HOTELWEB</div>
                <p class="login-subtitle">Gerenciamento Hoteleiro Inteligente</p>
            </div>

            <!-- Formulário -->
            <form id="form-login">
                <div class="form-group">
                    <label for="cpf">CPF</label>
                    <div class="input-icon-wrapper">
                        <i class="fa-solid fa-user"></i>
                        <input 
                            type="text" 
                            id="cpf" 
                            required 
                            placeholder="Digite seu CPF (apenas números)"
                            maxlength="11"
                            autocomplete="off"
                        >
                    </div>
                    <small class="form-help">Apenas números, sem pontos ou traços</small>
                </div>

                <div class="form-group">
                    <label for="senha">Senha de Acesso</label>
                    <div class="input-icon-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input 
                            type="password" 
                            id="senha" 
                            required 
                            placeholder="••••••••"
                            minlength="6"
                        >
                    </div>
                    <small class="form-help">Mínimo 6 caracteres</small>
                </div>

                <button type="submit" class="btn-login" id="btnLogin">
                    <span id="btnTexto"><i class="fa-solid fa-arrow-right-to-bracket"></i> Acessar Painel</span>
                    <span id="btnLoader" class="spinner" style="display: none;"></span>
                </button>
                
                <div id="mensagem-erro"></div>
            </form>

            <!-- Rodapé -->
            <div class="login-footer">
                &copy; 2026 HotelWeb &bull; Módulo Restrito
            </div>
        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script src="../js/api.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>

<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HotelWeb - Quartos</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header>

        <h1>HotelWeb</h1>

        <p>Gerenciamento de quartos</p>

    </header>


    <main>

        <!-- CADASTRO -->

        <section>

            <h2>Cadastrar quarto</h2>

            <form id="form-quarto">

                <input id="numero" type="text" placeholder="Número" required>

                <select id="tipo" required>

                    <option value="">
                        Tipo
                    </option>

                    <option value="SIMPLES">
                        Simples
                    </option>

                    <option value="DUPLO">
                        Duplo
                    </option>

                    <option value="SUITE">
                        Suíte
                    </option>

                </select>

                <input id="valorDiaria" type="number" step="0.01" placeholder="Valor da diária" required>

                <label>

                    <input id="incluiCafeDaManha" type="checkbox">

                    Café da manhã

                </label>

                <button type="submit">
                    Cadastrar
                </button>

            </form>

        </section>


        <!-- MENSAGEM -->

        <p id="mensagem"></p>


        <!-- LISTA -->

        <section>

            <h2>Quartos</h2>

            <button id="atualizar">
                Atualizar
            </button>

            <table>

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>Número</th>
                        <th>Tipo</th>
                        <th>Diária</th>
                        <th>Café</th>
                        <th>Ocupação</th>
                        <th>Limpeza</th>
                        <th>Ação</th>

                    </tr>

                </thead>

                <tbody id="lista-quartos">

                </tbody>

            </table>

        </section>

    </main>


    <!-- PRIMEIRO A API -->

    <script src="js/api.js"></script>

    <!-- DEPOIS A LÓGICA -->

    <script src="js/quartos.js"></script>

</body>

</html>
